name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Require tag matches a CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "## \[${version}\]" CHANGELOG.md; then
            echo "Tag v${version} has no corresponding CHANGELOG entry" >&2
            exit 1
          fi
  test:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
  package:
    needs: [verify-tag, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Build release binary
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w \
            -X main.cliVersion=${GITHUB_REF_NAME} \
            -X main.gitCommit=$(git rev-parse --short HEAD) \
            -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/laststate-relay ./cmd/laststate-relay
      - name: Build Docker image
        if: startsWith(matrix.os, 'ubuntu')
        run: docker build -t laststate-relay:${GITHUB_REF_NAME} .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
      - name: Create release
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          assets=$(find dist -type f -print0 | xargs -0 -I{} echo "{}")
          gh release create "${GITHUB_REF_NAME}" $assets --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
