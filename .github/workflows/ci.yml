name: CI
on:
  push:
    branches: [main, master, dev, prod]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Protocol LEP goldens (vendored)
        shell: bash
        run: go test ./internal/lep -run TestProtocolVectors -count=1 -v
      - name: Test
        shell: bash
        run: go test -race ./...
      - run: go build ./cmd/laststate-relay
      # Live Trace e2e (//go:build e2e) needs a running Trace:
      # TRACE_E2E_URL=… TRACE_E2E_TOKEN=… go test -tags=e2e ./internal/delivery -run TestLiveTrace

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
