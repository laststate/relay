name: CI
on:
  push:
    branches: [dev, prod]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout protocol vectors
        uses: actions/checkout@v4
        with:
          repository: laststate/protocol
          path: protocol-ref
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Protocol LEP goldens
        shell: bash
        env:
          PROTOCOL_VECTORS: ${{ github.workspace }}/protocol-ref/test-vectors
        run: go test ./internal/lep -run TestProtocolVectors -count=1 -v
      - name: Test
        shell: bash
        env:
          PROTOCOL_VECTORS: ${{ github.workspace }}/protocol-ref/test-vectors
        run: go test -race ./...
      - run: go build ./cmd/laststate-relay

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
