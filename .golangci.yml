run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  fast: false
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/laststate/relay

linters-settings:
  errcheck:
    check-blank: false
  goimports:
    local-prefixes: github.com/laststate/relay
  govet:
    enable:
      - nilness
  unused:
    check-exported: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # Conversions of len() to fixed-width fields are bounded by validated
    # payload limits (MaxFrameBytes, MaxBodyBytes); no overflow is reachable.
    - linters:
        - gosec
      text: "G115:"
    # math/rand powers delivery backoff jitter only; it is not used for
    # secrets or nonces.
    - linters:
        - gosec
      text: "G404:"
    # leaseWhere is a constant fragment controlled by this package, never
    # derived from input.
    - linters:
        - gosec
      text: "G202:"
  exclude-dirs:
    - vendor
    - migrations
